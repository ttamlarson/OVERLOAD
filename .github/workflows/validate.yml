name: Validate OVERLOAD
on:
  pull_request:
  push:
    branches: [main]
jobs:
  coach-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript and PWA metadata
        run: |
          node --check beta-feedback.js
          node --check backup-validation.js
          node --check sync-client.js
          node --check ai-coach-client.js
          node --check sw.js
          node --check update.js
          node --check workers/ai-coach/src/index.mjs
          node <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = html.split('<script').slice(1).map(block => block.slice(block.indexOf('>') + 1, block.indexOf('</script>'))).filter(source => source.trim());
          scripts.forEach((source, index) => {
            const path = `/tmp/overload-inline-${index}.js`;
            fs.writeFileSync(path, source);
            const result = spawnSync(process.execPath, ['--check', path], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout);
              process.exit(result.status || 1);
            }
          });
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const metadata = JSON.parse(fs.readFileSync('version.json', 'utf8'));
          const update = fs.readFileSync('update.js', 'utf8');
          const feedback = fs.readFileSync('beta-feedback.js', 'utf8');
          const serviceWorker = fs.readFileSync('sw.js', 'utf8');
          const version = metadata.version;
          if (!version || !update.includes('APP_VERSION = "' + version + '"') ||
              !feedback.includes("VERSION='" + version + "'") ||
              !serviceWorker.includes('overload-shell-' + version) ||
              !serviceWorker.includes('v' + version)) {
            throw new Error('OVERLOAD release version is inconsistent across app metadata, update manager, feedback form and service worker.');
          }
          const queryVersions = [...html.matchAll(/[?&]v=([0-9.]+)/g)].map(match => match[1]);
          if (queryVersions.some(value => value !== version)) {
            throw new Error('A cache-busted app asset does not match version.json.');
          }
          const coreMatch = serviceWorker.match(/const CORE = \[(.*?)\];/s);
          if (!coreMatch) throw new Error('Service-worker CORE asset list could not be parsed.');
          const coreAssets = [...coreMatch[1].matchAll(/"([^"]+)"/g)].map(match => match[1]);
          for (const asset of coreAssets) {
            const localPath = asset.replace(/^\.\//, '');
            if (localPath && !fs.existsSync(localPath)) throw new Error('Missing service-worker core asset: ' + asset);
          }
          for (const icon of manifest.icons || []) {
            const localPath = icon.src.replace(/^\.\//, '');
            if (!fs.existsSync(localPath)) throw new Error('Missing manifest icon: ' + icon.src);
          }
          console.log('Release metadata, cache-busted asset versions, service-worker core assets and manifest icons are consistent.');
          console.log(`Validated ${scripts.length} inline script blocks and PWA JSON metadata.`);
          NODE
      - name: Run coaching engine and AI API tests
        run: node --test tests/ai-coach-client.test.mjs tests/backup-validation.test.js tests/coach-engine.test.js tests/muscle-map.test.js tests/personal-records.test.js tests/programme-templates.test.js workers/ai-coach/test/worker.test.mjs
